name: Bug report
description: Something does not work as documented or as the layered architecture intends.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Search existing issues first. This repo is the Webpack-era layered reference. For new products, use [react-vite-boilerplate](https://github.com/tiagovilasboas/react-vite-boilerplate).
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npm install
        2. npm run …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node version (see `.nvmrc`), OS, npm version.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: Logs, screenshots, related files (`src/modules/…`, scripts).
